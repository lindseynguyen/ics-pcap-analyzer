name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (pyflakes, errors only)
        run: |
          python -m pyflakes ot_pcap_analyzer tests | grep -E "undefined name|syntax error|invalid syntax" && exit 1 || true
      - name: Run tests
        run: python -m pytest --cov=ot_pcap_analyzer --cov-report=term
